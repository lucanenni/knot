## IDF Component Manager Manifest File
dependencies:
  espressif/usb_host_cdc_acm: "^2.0.4"
  sukuwc/grid_esp32_led: "*"
  sukuwc/grid_esp32_nvm: "*"
  sukuwc/grid_esp32_littlefs: "*"
  # NOTE: grid_common / littlefs / tinyusb / tomlc99 are vendored as LOCAL
  # components under Firmware/components/ (matching intechstudio/grid-fw).
  # grid_common as published on the registry needs littlefs/tinyusb/tomlc99
  # but does not declare them, and the registry versions of
  # joltwallet/littlefs + espressif/esp_tinyusb are incompatible with it.
  # grid_common itself is vendored (not just its 3 deps) so grid_usb.c can be
  # patched for a clean "Knot MIDI" USB identity instead of Grid's
  # CDC+MIDI+HID composite - see grid_common/common/src/c/grid_usb.c.
  ## Required IDF version
  idf:
    version: ">=4.1.0"
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
